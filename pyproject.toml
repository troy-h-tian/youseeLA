[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youseela"
version = "0.1.0"
description = "Evidence-based experimental neighborhood vulnerability assessments"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "httpx>=0.27,<1", "python-dotenv>=1,<2", "shapely>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
vision = ["torch==2.14.1", "torchvision==0.29.1", "clip @ git+https://github.com/openai/CLIP.git@d05afc436d78f1c48dc0dbf8e5980a9d471f35f6"]

[project.scripts]
youseela = "youseela.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
